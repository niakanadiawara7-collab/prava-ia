<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trouver le bon artisan · Prava</title>
  <link rel="stylesheet" href="/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A8%3C/text%3E%3C/svg%3E">
  <style>
    .pro { display: grid; gap: 6px; }
    .pro .top { display: flex; gap: 10px; align-items: center; }
    .score { font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 10px; font-size: 13px; white-space: nowrap; }
    .pro ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
    .pick { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); margin: 0; }
    .pick input { width: auto; }
    .understood { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
  </style>
</head>
<body>
  <div class="public">
    <h1>Trouvez le bon artisan pour vos travaux</h1>
    <p class="sub">Décrivez votre besoin avec vos mots. Prava comprend votre demande et vous propose les 3 artisans les plus adaptés près de chez vous. Gratuit et sans engagement.</p>

    <form class="card" id="f">
      <label for="text">Votre projet</label>
      <textarea id="text" rows="4" required placeholder="ex. Je veux refaire ma salle de bain : remplacer la baignoire par une douche à l'italienne et refaire le carrelage."></textarea>
      <div class="row">
        <div style="flex:1;min-width:180px"><label for="loc">Ville ou code postal</label><input id="loc" required placeholder="ex. Paris 11e ou 75011"></div>
        <div style="flex:1;min-width:180px"><label for="urg">Quand ?</label><select id="urg"><option value="urgent">C'est urgent</option><option value="sous 1 mois" selected>Dans le mois</option><option value="pas pressé">Je ne suis pas pressé</option></select></div>
      </div>
      <label for="photo">Une photo (facultatif)</label><input type="file" id="photo" accept="image/*">
      <p><button class="primary" id="go" type="submit">Trouver mes artisans</button></p>
    </form>

    <div id="results"></div>
  </div>

  <script>
    const B = location.search.includes("b=") ? "?b=" + encodeURIComponent(new URLSearchParams(location.search).get("b")) : "";
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const post = (u, b) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then((r) => r.json());
    let photo = null, requestId = null;

    $("#photo").onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const img = new Image();
      img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); photo = c.toDataURL("image/jpeg", 0.85); };
      img.src = URL.createObjectURL(f);
    };

    $("#f").onsubmit = async (e) => {
      e.preventDefault();
      $("#go").disabled = true; $("#go").textContent = "Recherche en cours…";
      const r = await post("/api/public/match" + B, { text: $("#text").value, location: $("#loc").value, urgency: $("#urg").value, photo });
      $("#go").disabled = false; $("#go").textContent = "Relancer la recherche";
      requestId = r.requestId;
      show(r);
    };

    async function show({ need, matches }) {
      const trades = await fetch("/api/public/trades" + B).then((r) => r.json());
      $("#results").innerHTML = `
        <div class="understood"><b>Nous avons compris :</b> ${esc(need.resume)}<br>
          <span class="muted">Métier(s) : ${esc(need.metiers.join(", ") || "à préciser")} · ${esc(need.ville || need.code_postal || "lieu à préciser")} · ${esc(need.urgence)}${need.budget ? " · budget " + esc(need.budget) : ""}</span></div>
        ${matches.length ? `<h2 style="margin-top:18px">Les artisans les plus adaptés</h2>
          <p class="muted">Cochez ceux à qui vous voulez envoyer votre demande (3 maximum).</p>
          ${matches.map((p, i) => `<div class="card pro">
            <div class="top"><h2 style="margin:0;flex:1">${esc(p.name)}</h2><span class="score">${p.score} % adapté</span></div>
            <div class="muted">${esc(p.city)} · ${"€".repeat(p.priceLevel)} · ${esc(p.description)}</div>
            <ul>${p.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
            <label class="pick"><input type="checkbox" class="sel" value="${esc(p.id)}" ${i < 2 ? "checked" : ""}> Envoyer ma demande à cet artisan</label>
          </div>`).join("")}
          <form class="card" id="contact">
            <h2>Vos coordonnées</h2>
            <p class="muted" style="margin-top:0">Elles sont transmises uniquement aux artisans cochés.</p>
            <label for="cn">Nom</label><input id="cn" required><label for="cp">Téléphone</label><input id="cp" required><label for="ce">Email (facultatif)</label><input id="ce" type="email">
            <p><button class="primary" type="submit">Envoyer ma demande</button></p>
            <p id="msg" class="muted"></p>
          </form>`
        : `<div class="card"><p>Nous n'avons pas trouvé de métier correspondant. Précisez votre demande ou choisissez le métier :</p>
            <select id="trade">${trades.map((t) => `<option>${esc(t)}</option>`).join("")}</select>
            <p><button class="primary" id="retry">Chercher dans ce métier</button></p></div>`}`;
      $("#retry")?.addEventListener("click", async () => { const r = await post("/api/public/match" + B, { text: $("#text").value, location: $("#loc").value, urgency: $("#urg").value, trade: $("#trade").value }); requestId = r.requestId; show(r); });
      $("#contact")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const providerIds = [...document.querySelectorAll(".sel:checked")].map((c) => c.value);
        const r = await post("/api/public/leads" + B, { requestId, providerIds, name: $("#cn").value, phone: $("#cp").value, email: $("#ce").value });
        if (r.error) { $("#msg").textContent = r.error; return; }
        $("#results").innerHTML = `<div class="card"><h2>✅ Demande envoyée</h2><p>Votre demande est partie chez <b>${r.sentTo.map(esc).join(", ")}</b>. Ils vont vous recontacter rapidement. Vous allez aussi recevoir un SMS de confirmation.</p></div>`;
        $("#results").scrollIntoView({ behavior: "smooth" });
      });
      $("#results").scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
